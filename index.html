<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menezo — AI Creator Manager</title>
  <meta name="description" content="Menezo is an AI-powered manager for content creators — plan content, generate scripts and captions, and grow across every platform.">
  <style>
    body {
      background:#08090d; color:#f1f5f9; font-family: sans-serif;
      display:flex; align-items:center; justify-content:center; height:100vh; margin:0;
    }
    .loader { text-align:center; }
    .spinner {
      width:34px; height:34px; border:3px solid rgba(245,158,11,0.2);
      border-top-color:#f59e0b; border-radius:50%;
      animation: spin 0.8s linear infinite; margin:0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size:13px; color:#94a3b8; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Loading Menezo...</p>
  </div>

  <script>
    try {
      const saved = localStorage.getItem('menezo_user');
      if (saved) {
        window.location.href = 'dashboard.html';
      } else {
        window.location.href = 'login.html';
      }
    } catch (e) {
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CreatorOS AI SaaS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brandDark: '#08090d',
            cardDark: '#0f1320',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #08090d;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    .glossy-card {
      background: linear-gradient(135deg, rgba(20, 24, 38, 0.85) 0%, rgba(12, 15, 25, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    
    .glow-purple {
      box-shadow: 0 0 40px -10px rgba(147, 51, 234, 0.35);
    }
  </style>
</head>
<body class="bg-[#08090d] min-h-screen flex items-center justify-center p-4 selection:bg-amber-500/30">

  <!-- Background decorative glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/15 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[350px] h-[350px] bg-amber-500/10 rounded-full blur-[100px]"></div>
  </div>

  <main class="w-full max-w-md relative z-10">
    
    <!-- Header Logo & Branding -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500/20 to-purple-600/30 border border-amber-400/30 p-2.5 mb-3 shadow-lg shadow-amber-500/10">
        <svg viewBox="0 0 48 48" fill="none" class="w-full h-full">
          <path d="M24 4L41.3205 14V34L24 44L6.67949 34V14L24 4Z" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M24 12C17.37 12 12 17.37 12 24C12 30.6 17.37 36 24 36C29.5 36 34 31.8 35.6 26.5" stroke="#f59e0b" stroke-width="3.5"/>
          <circle cx="24" cy="24" r="3.5" fill="#f59e0b"/>
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">CreatorOS <span class="text-amber-400">AI</span></h1>
      <p class="text-xs text-slate-400 mt-1">Connect your Creator Identity & Access Dynamic Dashboard</p>
    </div>

    <!-- Login Form Card -->
    <div class="glossy-card rounded-3xl p-6 sm:p-8 glow-purple">
      
      <!-- Fast Pre-fill Demo buttons -->
      <div class="mb-5 p-3 rounded-2xl bg-[#141928]/80 border border-white/[0.06]">
        <div class="text-[11px] font-bold text-amber-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Quick 1-Click Fill
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="fillDemo('Tanu Sharma', '@TechWithTanu', 'YouTube', 'AI & Tech Tutorials', '125K')" class="px-2.5 py-1.5 rounded-xl bg-purple-600/20 hover:bg-purple-600/30 border border-purple-500/30 text-purple-200 text-xs font-semibold transition text-left truncate">
            ✨ Tanu (YouTube 125K)
          </button>
          <button type="button" onclick="fillDemo('Aarav Mehta', '@aarav.builds', 'Instagram', 'Startup & Design', '84K')" class="px-2.5 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 border border-indigo-500/30 text-indigo-200 text-xs font-semibold transition text-left truncate">
            📸 Aarav (IG 84K)
          </button>
        </div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        
        <!-- Creator Name Input -->
        <div>
          <label for="creatorName" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center justify-between">
            <span>Creator Full Name</span>
            <span class="text-[10px] text-purple-400 font-normal">Required</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              id="creatorName" 
              required
              placeholder="e.g. Tanu Sharma"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#0c0f1a] border border-white/10 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            />
          </div>
        </div>

        <!-- Channel ID / Handle Input -->
        <div>
          <label for="channelId" class="block text-xs font-semibold text-slate-300 mb-1.5 flex items-center justify-between">
            <span>Channel ID / Handle</span>
            <span class="text-[10px] text-amber-400 font-normal">e.g. @TechWithTanu or UC...</span>
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="at-sign" class="w-4 h-4"></i>
            </div>
            <input 
              type="text" 
              id="channelId" 
              required
              placeholder="e.g. @TechWithTanu"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-[#0c0f1a] border border-white/10 text-white placeholder-slate-500 text-sm font-mono focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
            />
          </div>
        </div>

        <!-- Platform & Niche Dropdowns -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="platform" class="block text-xs font-semibold text-slate-300 mb-1.5">Primary Platform</label>
            <select 
              id="platform" 
              class="w-full px-3 py-2.5 rounded-xl bg-[#0c0f1a] border border-white/10 text-white text-xs focus:outline-none focus:border-purple-400 transition"
            >
              <option value="YouTube">YouTube</option>
              <option value="Instagram">Instagram</option>
              <option value="X">X (Twitter)</option>
              <option value="Pinterest">Pinterest</option>
              <option value="Facebook">Facebook</option>
              <option value="TikTok">TikTok</option>
            </select>
          </div>

          <div>
            <label for="niche" class="block text-xs font-semibold text-slate-300 mb-1.5">Niche / Category</label>
            <select 
              id="niche" 
              class="w-full px-3 py-2.5 rounded-xl bg-[#0c0f1a] border border-white/10 text-white text-xs focus:outline-none focus:border-purple-400 transition"
            >
              <option value="AI & Tech Tutorials">Tech & AI</option>
              <option value="Finance & Crypto">Finance & Wealth</option>
              <option value="Coding & Software">Coding & Dev</option>
              <option value="Fitness & Health">Fitness & Wellness</option>
              <option value="Lifestyle & Vlog">Lifestyle & Vlogs</option>
              <option value="Gaming & Esports">Gaming</option>
            </select>
          </div>
        </div>

        <!-- Follower Count (Optional) -->
        <div>
          <label for="followersCount" class="block text-xs font-semibold text-slate-300 mb-1.5">Current Community Size (Estimate)</label>
          <input 
            type="text" 
            id="followersCount" 
            placeholder="e.g. 125K" 
            value="125K"
            class="w-full px-3.5 py-2 rounded-xl bg-[#0c0f1a] border border-white/10 text-white placeholder-slate-500 text-xs focus:outline-none focus:border-amber-400 transition"
          />
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          id="submitBtn"
          class="w-full mt-2 py-3 px-4 rounded-xl bg-gradient-to-r from-amber-500 via-orange-500 to-purple-600 hover:opacity-95 text-slate-950 font-extrabold text-sm flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 active:scale-[0.98] transition cursor-pointer"
        >
          <i data-lucide="zap" class="w-4 h-4 fill-slate-950"></i>
          <span>Save & Launch Dynamic Dashboard</span>
        </button>

      </form>

      <!-- Security Guarantee Note -->
      <div class="mt-5 pt-4 border-t border-white/[0.06] text-center text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i>
        <span>Data stored locally in browser session & synced with AI Manager</span>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();

    function fillDemo(name, channelId, platform, niche, followers) {
      document.getElementById('creatorName').value = name;
      document.getElementById('channelId').value = channelId;
      document.getElementById('platform').value = platform;
      document.getElementById('niche').value = niche;
      document.getElementById('followersCount').value = followers;
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('creatorOS_user');
        if (saved) {
          const user = JSON.parse(saved);
          if (user.name) document.getElementById('creatorName').value = user.name;
          if (user.channelId) document.getElementById('channelId').value = user.channelId;
          if (user.platform) document.getElementById('platform').value = user.platform;
          if (user.niche) document.getElementById('niche').value = user.niche;
          if (user.followers) document.getElementById('followersCount').value = user.followers;
        }
      } catch (e) {
        console.warn('Storage read error', e);
      }
    });

    async function handleLogin(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Connecting Channel ID...</span>';

      const name = document.getElementById('creatorName').value.trim();
      let channelId = document.getElementById('channelId').value.trim();
      if (!channelId.startsWith('@') && !channelId.startsWith('UC') && !channelId.includes('.')) {
        channelId = '@' + channelId;
      }
      const platform = document.getElementById('platform').value;
      const niche = document.getElementById('niche').value;
      const followers = document.getElementById('followersCount').value.trim() || '125K';

      const userData = {
        name,
        channelId,
        platform,
        niche,
        followers,
        loginTime: new Date().toISOString(),
        score: 88,
        avatarUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80'
      };

      // 1. Save in localStorage
      localStorage.setItem('creatorOS_user', JSON.stringify(userData));

      // 2. Sync with backend API
      try {
        await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(userData)
        });
      } catch (err) {
        console.log('Direct local storage fallback active');
      }

      // 3. Open dashboard
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    }
  </script>
</body>
</html>
